<div class="bg-app-container">
  <div class="card-principal">
    
    <!-- Barra Superior -->
    <barra-superior 
      [nomeUsuario]="nomeUsuario" 
      [urlAvatarUsuario]="urlAvatarUsuario" 
      [ativo]="sistemaAtivo"
    ></barra-superior>

    <div class="layout-conteudo">
      <!-- Barra Lateral -->
      <barra-lateral [itemAtivo]="itemNavegacaoAtivo" (itemSelecionado)="lidarSelecaoMenu($event)"></barra-lateral>

      <!-- Painel Central -->
      <main class="painel-central">
        @if (itemNavegacaoAtivo === 'scan') {
          <painel-scan></painel-scan>
        } @else if (itemNavegacaoAtivo === 'estoque') {
          <painel-catalogo></painel-catalogo>
        } @else {
          <div class="painel-placeholder">
            <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="var(--brand-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="16" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
            <h2>Módulo: {{ itemNavegacaoAtivo | uppercase }}</h2>
            <p>Esta funcionalidade está sendo atualizada no sistema.</p>
          </div>
        }
      </main>

      <!-- Painel do Carrinho (Exibido apenas na interface de Scan) -->
      @if (itemNavegacaoAtivo === 'scan') {
        <painel-carrinho 
          [itens]="carrinhoItens"
          (limparCarrinho)="lidarLimparCarrinho()"
          (finalizarCompra)="lidarFinalizarCompra()"
        ></painel-carrinho>
      }
    </div>

  </div>
</div>
