<!-- Botão do menu hambúrguer visível apenas em telas pequenas (< 768px) -->
<button class="botao-hamburguer" (click)="alternarMenu()" aria-label="Abrir Menu">
  <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="3" y1="12" x2="21" y2="12"></line>
    <line x1="3" y1="6" x2="21" y2="6"></line>
    <line x1="3" y1="18" x2="21" y2="18"></line>
  </svg>
</button>

<nav class="barra-lateral-container" [class.aberto]="menuAberto">

  <!-- Lista de Navegação -->
  <ul class="lista-navegacao">
    @for (item of itens; track item.id) {
      <li 
        class="item-menu" 
        [class.ativo]="item.id === itemAtivo" 
        (click)="selecionarItem(item)"
        [title]="item.rotulo"
      >
        <div class="icone-menu">
          @if (item.icone === 'scan') {
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
              <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
              <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
          } @else if (item.icone === 'estoque') {
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
              <polyline points="7.5 4.21 12 6.81 16.5 4.21"></polyline>
              <polyline points="2.9 8 12 13 21 8"></polyline>
              <polyline points="12 22 12 13"></polyline>
            </svg>
          }
        </div>
        <span class="rotulo-menu">{{ item.rotulo }}</span>
      </li>
    }
  </ul>
</nav>
